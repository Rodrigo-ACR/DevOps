name: CI/CD - Backend Despachos

on:
  push:
    branches:
      - deploy
    paths:
      - "back-Despachos_SpringBoot/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-push-deploy:
    name: Build, Push y Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO_BACKEND }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # La EC2 de backends está en la subred PRIVADA (10.0.2.x): GitHub Actions
      # no puede llegar directo. Se usa la EC2 web pública como salto (jump host).
      - name: Deploy en EC2 (app, subred privada)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_APP_PRIVATE_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_PUBLIC_IP }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            # Login a ECR usando el IAM role de la instancia (LabInstanceProfile).
            # No requiere credenciales en la EC2 ni tokens de sesión.
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY_URL }}

            # ── 1. Garantizar que MySQL esté corriendo ──────────────────
            # A prueba de carreras: si el otro pipeline lo creó primero,
            # el docker run falla pero el docker start lo levanta o ya está arriba.
            if [ -z "$(docker ps -q -f name=^mysql-db$)" ]; then
              docker rm mysql-db 2>/dev/null || true
              docker run -d \
                --name mysql-db \
                --restart unless-stopped \
                --network host \
                -e MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
                -e MYSQL_DATABASE=${{ secrets.DB_NAME }} \
                -e MYSQL_USER=${{ secrets.DB_USERNAME }} \
                -e MYSQL_PASSWORD=${{ secrets.DB_PASSWORD }} \
                -v mysql_data:/var/lib/mysql \
                mysql:8.0 || docker start mysql-db || true
            fi

            # Esperar a que MySQL acepte conexiones (máx ~2 min)
            for i in $(seq 1 40); do
              if docker exec mysql-db mysqladmin ping -h 127.0.0.1 --silent 2>/dev/null; then
                echo "MySQL listo"; break
              fi
              echo "Esperando MySQL... ($i)"; sleep 3
            done

            # ── 2. Desplegar backend despachos ──────────────────────────
            docker stop back-despachos || true
            docker rm back-despachos || true
            docker pull ${{ secrets.ECR_REGISTRY_URL }}/${{ secrets.ECR_REPO_BACKEND }}:latest
            docker run -d \
              --name back-despachos \
              --restart unless-stopped \
              --network host \
              -e DB_ENDPOINT=127.0.0.1 \
              -e DB_PORT=3306 \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              ${{ secrets.ECR_REGISTRY_URL }}/${{ secrets.ECR_REPO_BACKEND }}:latest

            # Limpiar imágenes viejas para no llenar el disco de 8GB
            docker image prune -af