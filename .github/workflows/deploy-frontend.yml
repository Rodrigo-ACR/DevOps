name: CI/CD - Frontend Despacho

on:
  push:
    branches:
      - deploy
    paths:
      - "front_despacho/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  build-push-deploy:
    name: Build, Push y Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO_FRONTEND }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./front_despacho
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Pull desde ECR: el build se hace UNA vez en el runner de GitHub
      # (potente) y la t3.micro solo descarga la imagen lista (~25MB nginx).
      # Nada de git clone + npm ci en una instancia de 1GB de RAM.
      - name: Deploy en EC2 (web, subred pública)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY_URL }}

            docker stop front-despacho || true
            docker rm front-despacho || true
            docker pull ${{ secrets.ECR_REGISTRY_URL }}/${{ secrets.ECR_REPO_FRONTEND }}:latest

            # El proxy de nginx apunta a la EC2 de backends por su IP privada.
            docker run -d \
              --name front-despacho \
              --restart unless-stopped \
              --network host \
              -e DESPACHOS_URL=http://${{ secrets.EC2_APP_PRIVATE_IP }}:8081 \
              -e VENTAS_URL=http://${{ secrets.EC2_APP_PRIVATE_IP }}:8080 \
              ${{ secrets.ECR_REGISTRY_URL }}/${{ secrets.ECR_REPO_FRONTEND }}:latest

            docker image prune -af
