apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: innovatech-cluster
  region: us-east-1
  version: "1.32"

availabilityZones:
  - us-east-1a
  - us-east-1b

iam:
  serviceRoleARN: arn:aws:iam::161205462017:role/LabRole
  withOIDC: false

managedNodeGroups:
  - name: nodos-innovatech
    instanceType: t3.medium
    minSize: 1
    maxSize: 3
    desiredCapacity: 2
    privateNetworking: true
    iam:
      instanceRoleARN: arn:aws:iam::161205462017:role/LabRole

cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator