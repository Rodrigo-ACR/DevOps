apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-despacho
  namespace: innovatech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-despacho
  template:
    metadata:
      labels:
        app: front-despacho
    spec:
      containers:
        - name: front-despacho
          image: 161205462017.dkr.ecr.us-east-1.amazonaws.com/innovatech-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: DESPACHOS_URL
              value: "http://back-despachos-service:8081"
            - name: VENTAS_URL
              value: "http://back-ventas-service:8080"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: front-despacho-service
  namespace: innovatech
spec:
  selector:
    app: front-despacho
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
